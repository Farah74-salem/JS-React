<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد</title>
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="card">
    <h2>إنشاء حساب جديد</h2>

    <form method="post" action="" id="registerForm" novalidate>

      <div class="input-group">
        <label for="fullName">الاسم الكامل</label>
        <div class="input-wrapper">
          <input type="text" id="fullName" placeholder="أدخل اسمك الكامل">
        </div>
        <small class="error-msg" id="fullNameError"></small>
      </div>

      <div class="input-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="name@example.com">
        </div>
        <small class="error-msg" id="emailError"></small>
      </div>

      <div class="input-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <small class="error-msg" id="passwordError"></small>

        <div class="strength-container">
          <div class="strength-header">
            <span>قوة كلمة المرور:</span>
            <span id="strengthText">ضعيفة جداً</span>
          </div>
          <div class="progress-bar-bg">
            <div id="strengthBar" class="progress-bar"></div>
          </div>
        </div>

        <ul class="requirements-list">
          <li id="reqLength">
            <i class="fa-solid fa-circle-xmark icon-status"></i>
            <span>بين 8 إلى 20 حرفًا</span>
          </li>
          <li id="reqCase">
            <i class="fa-solid fa-circle-xmark icon-status"></i>
            <span>تحتوي على حرف كبير وحرف صغير (A-Z, a-z)</span>
          </li>
          <li id="reqNum">
            <i class="fa-solid fa-circle-xmark icon-status"></i>
            <span>تحتوي على رقم (0-9)</span>
          </li>
          <li id="reqSpecial">
            <i class="fa-solid fa-circle-xmark icon-status"></i>
            <span>تحتوي على رمز خاص (!@#$%^&*...)</span>
          </li>
        </ul>
      </div>

      <button type="submit" id="submitBtn">انشاء الحساب</button>

    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
